<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop 4 – Page Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.5;
    }

    /* Task 1: Semantic elements */
    header nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 20px;
    }

    section {
      margin-bottom: 30px;
    }

    footer {
      border-top: 1px solid #ccc;
      margin-top: 30px;
    }

    /* Task 2: Grid layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 10px;
    }

    .grid-item {
      background-color: lightgreen;
      padding: 20px;
      text-align: center;
    }

    /* Task 3: Flexbox layout */
    .flex-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .box {
      background-color: lightblue;
      padding: 20px;
      text-align: center;
    }

    /* Task 4: Media queries */
    .responsive-box {
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .responsive-box {
        background-color: lightcoral;
      }
    }

    @media (min-width: 601px) {
      .responsive-box {
        background-color: lightseagreen;
      }
    }
  </style>
</head>
<body>
  <!-- Task 1: Semantic elements -->
  <header>
    <h1>My Website</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#grid">Grid</a></li>
        <li><a href="#flex">Flexbox</a></li>
        <li><a href="#responsive">Media queries</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>This is a paragraph about me.</p>
    </section>

    <!-- Task 2: Grid layout -->
    <section id="grid">
      <h2>Grid Layout</h2>
      <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
      </div>
    </section>

    <!-- Task 3: Flexbox layout -->
    <section id="flex">
      <h2>Flexbox Layout</h2>
      <div class="flex-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </div>
    </section>

    <!-- Task 4: Media queries -->
    <section id="responsive">
      <h2>Media Queries</h2>
      <div class="responsive-box">Resize the window to see the effect</div>
    </section>
  </main>

  <footer>
    <p>Copyright 2026 · <a href="../">Back to all workshops</a></p>
  </footer>
</body>
</html>
